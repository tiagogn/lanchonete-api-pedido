apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanchonete-pedido-deployment
  namespace: lanchonete-pedido
  labels:
    app: ds-lanchonete-pedido
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ds-lanchonete-pedido
  template:
    metadata:
      labels:
        app: ds-lanchonete-pedido
    spec:
      containers:
        - name: lanchonete-pedido
          image: edureef42/lanchonete-pedido:1.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "1024Mi"   # Limite de memória que o container pode usar
              cpu: "1000m"       # Limite de CPU
            requests:
              memory: "512Mi"   # Quantidade mínima de memória necessária
              cpu: "250m"       # Quantidade mínima de CPU necessária
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prd"
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: lanchonete-pedido-configmap
                  key: PG_HOST
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: "lanchonete-pedido"
          readinessProbe:
            httpGet:
              path: /lanchonete-pedido/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /lanchonete-pedido/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20